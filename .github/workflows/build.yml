name: Samsung Galaxy A50 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Import Kernel Source
      uses: actions/checkout@v4   
      
    - name: Install required package
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git libssl-dev bc flex bison \
          libncurses5-dev libncurses-dev libtinfo5 cpio zip unzip \
          python3 curl rsync kmod libelf-dev \
          lz4 tar openssl python3-pip \
          gcc clang

    - name: Setting Scripts Permission
      run: |    
        chmod +x build.sh       

    - name: Kernel Build
      run: |   
        ./build.sh